[project]
name = "voice-fleet"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.uv.workspace]
members = ["apps/api", "apps/voice-worker"]

[tool.uv.sources]
voice-fleet-api = { workspace = true }
voice-fleet-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "apps/voice-worker/src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
