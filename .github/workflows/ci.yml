name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: voice_fleet_test
          POSTGRES_USER: voice_fleet_test
          POSTGRES_PASSWORD: synthetic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_fleet_test -d voice_fleet_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://voice_fleet_test:synthetic_ci_only_password@localhost:5432/voice_fleet_test
      APP_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.8"
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-packages --group dev
          npm ci
          npx playwright install --with-deps chromium
      - name: Python lint and types
        run: |
          uv run --frozen --all-packages ruff check .
          uv run --frozen --all-packages ruff format --check .
          uv run --frozen --all-packages mypy apps/api/src apps/voice-worker/src tests
      - name: Web lint, types, and build
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Unit and database integration tests
        run: |
          uv run --frozen --all-packages pytest tests/unit
          uv run --frozen --all-packages pytest tests/integration
      - name: Browser authentication
        run: npm run test:e2e
      - name: Clean Compose startup
        run: uv run --frozen --all-packages python scripts/check_startup.py

