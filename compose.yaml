services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: voice_fleet
      POSTGRES_USER: voice_fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_fleet -d voice_fleet"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["alembic", "upgrade", "head"]
    environment: &api_env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_BROWSER_URL: ${LIVEKIT_BROWSER_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      PLAYGROUND_MAX_SECONDS: ${PLAYGROUND_MAX_SECONDS:-600}
      CONSOLE_BRAND_NAME: ${CONSOLE_BRAND_NAME:-Voice Fleet}
      CONSOLE_ACCENT_COLOR: "${CONSOLE_ACCENT_COLOR:-#0b5960}"
      CONSOLE_DEFAULT_GROUPS: ${CONSOLE_DEFAULT_GROUPS:-pending,active,error,ended}
      CONSOLE_VISIBLE_MODULES: ${CONSOLE_VISIBLE_MODULES:-overview,board,history,agents,numbers,logs,settings}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "voice_fleet_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *api_env
      OUTBOUND_SIP_TRUNK_ID: ${OUTBOUND_SIP_TRUNK_ID:-}
      OUTBOUND_TEST_DESTINATION: ${OUTBOUND_TEST_DESTINATION:-}
      OUTBOUND_TEST_MAX_SECONDS: ${OUTBOUND_TEST_MAX_SECONDS:-180}
      INBOUND_SIP_ALLOWED_ADDRESSES: ${INBOUND_SIP_ALLOWED_ADDRESSES:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-m", "voice_fleet_worker", "start"]
    environment:
      <<: *api_env
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
